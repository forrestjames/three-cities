<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm Geometry: Slice</title>
<meta name="robots" content="noindex">
<meta name="description" content="Cut the bar into eight slices and play them in any order. With full MIDI out.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abel&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="/rhythm-geometry/live/live.css">
</head>
<body data-surface="slice">
<header class="head">
  <p class="eyebrow">Rhythm Geometry · <b>Slice</b></p>
  <h1 id="cityName">London</h1>
  <p class="facts" id="facts"></p>
  <p class="genre" id="genreLine"></p>
  <div class="picks"><select id="city" aria-label="City"></select><select id="genre" aria-label="Genre"></select></div>
  <p class="how"><b>Eight slices of the bar.</b>Hold a pad and that slice loops. Hold a few and they play in the order you pressed them. Drag one pad onto another to swap them for good. Every move goes out over MIDI too.</p>
</header>
<main class="stage">
  <div class="ringbox"><div class="padwrap"><canvas id="rings" aria-label="The rings, with the eight slices drawn round the outside"></canvas></div></div>
  <div class="slices" id="slices" role="group" aria-label="The eight slices. Hold to loop, drag to swap."></div>
</main>
<aside class="side">
  <p class="lab">Reorder</p>
  <div class="acts">
    <button class="pill" type="button" data-act="scramble" title="A new order for the eight slices"><kbd>Z</kbd>Scramble</button>
    <button class="pill" type="button" data-act="mirror" title="Play the slices back to front"><kbd>X</kbd>Mirror</button>
    <button class="pill" type="button" data-act="turn" title="Move every slice one place round"><kbd>C</kbd>Turn</button>
    <button class="pill" type="button" data-act="reset" title="Back to the rhythm as written"><kbd>V</kbd>Reset</button>
    <button id="latch" class="pill wide" type="button" aria-pressed="false" title="Pads stay down when you let go. Press again to lift them."><kbd>L</kbd>Latch the pads</button>
  </div>
  <label class="row">Scramble by itself<select id="auto"><option value="0">Off</option><option value="1">Every bar</option><option value="2">Every 2 bars</option><option value="4">Every 4 bars</option><option value="8">Every 8 bars</option></select></label>
  <p class="lab">Hold to repeat</p>
  <div class="acts">
    <button class="pill" type="button" data-rep="4" aria-pressed="false"><kbd>Q</kbd>1/4</button>
    <button class="pill" type="button" data-rep="2" aria-pressed="false"><kbd>W</kbd>1/8</button>
    <button class="pill" type="button" data-rep="1" aria-pressed="false"><kbd>E</kbd>1/16</button>
    <button class="pill" type="button" data-rep="0.5" aria-pressed="false"><kbd>R</kbd>1/32</button>
    <button id="rev" class="pill wide" type="button" aria-pressed="false" title="Hold to play the bar backwards"><kbd>T</kbd>Backwards</button>
  </div>
  <label class="row">Thin to full <span id="densV">as written</span><input id="dens" type="range" min="-100" max="100" value="0"></label>
  <label class="row">Filter <span id="cutV">open</span><input id="cut" type="range" min="0" max="100" value="50"></label>
  <div class="space">
    <label class="row kc">Scatter <span id="scatV">0%</span><input class="k" id="scat" type="range" min="0" max="100" value="0" aria-label="How much the hits scatter, all the time"></label>
    <label class="row kc">Cluster <span id="clusV">0%</span><input class="k" id="clus" type="range" min="0" max="100" value="0" aria-label="How much the hits crowd together, all the time"></label>
    <label class="row kc">Volume <span id="volV">90%</span><input class="k" id="vol" type="range" min="0" max="100" value="90" aria-label="Overall volume"></label>
    <label class="row kc">Octave <span id="octV">0</span><input class="k" id="oct" type="range" min="-3" max="3" step="1" value="0" aria-label="Octave shift"></label>
    <label class="row kc">Decay <span id="decayV">1x</span><input class="k" id="decay" type="range" min="20" max="250" value="100" aria-label="How long the sounds ring"></label>
    <label class="row kc">Echo <span id="echoV">off</span><input class="k" id="echoAmt" type="range" min="0" max="100" value="0" aria-label="Echo amount"></label>
    <label class="row kc">Reverb <span id="verbV">10%</span><input class="k" id="verbAmt" type="range" min="0" max="100" value="10" aria-label="Reverb amount"></label>
    <label class="row">Echo time <select id="echoDiv" aria-label="Echo time"><option value="1">1/4</option><option value="0.75" selected>dotted 1/8</option><option value="0.5">1/8</option><option value="0.3333333333">1/8 triplet</option><option value="0.25">1/16</option></select></label>
    <label class="row">Chords change <select id="chordBars" aria-label="How often the chords change"><option value="0">Never</option><option value="1">1 bar</option><option value="2">2 bars</option><option value="4">4 bars</option><option value="8">8 bars</option><option value="16">16 bars</option></select></label>
    <label class="row">Melody changes <select id="melBars" aria-label="How often the melody changes"><option value="0">Never</option><option value="1">1 bar</option><option value="2">2 bars</option><option value="4">4 bars</option><option value="8">8 bars</option><option value="16">16 bars</option></select></label>
    <label class="row">Key <select id="key" aria-label="Key"></select></label>
    <label class="row">Scale <select id="scale" aria-label="Scale"></select></label>
  </div>
</aside>
<footer class="bar">
  <button id="play" type="button" aria-pressed="false" aria-label="Play" title="Play or stop. Space bar."></button>
  <div class="tempo"><small>Tempo</small><b id="bpmV">120</b><input id="bpm" type="range" min="60" max="180" value="120" aria-label="Tempo"></div>
  <button id="tap" class="pill" type="button" title="Tap three or more times to set the tempo">Tap</button>
  <select id="kit" aria-label="Drum kit"></select>
  <button id="mode" class="pill" type="button" aria-pressed="false" title="Drums: the rings play the kit. Notes: every ring plays a note of the chord, for your synths."><i class="dot"></i><span>Drums</span></button>
  <select id="voice" aria-label="Melodic sound" title="The sound the note rings play"></select>
  <div class="lanes" id="lanes" role="group" aria-label="Rings. Click one to mute it."></div>
  <button id="rec" class="pill" type="button" aria-pressed="false" title="Record everything you hear as a WAV file"><i class="dot"></i><span>Record</span></button>
  <button id="midi" class="pill" type="button" aria-pressed="false" title="Send everything to your drum machine, synths or DAW">MIDI</button>
</footer>
<script src="/rhythm-geometry/rg-midi.js"></script>
<script src="/rhythm-geometry/live/data.js"></script>
<script src="/rhythm-geometry/live/tcvoices.js"></script>
<script src="/rhythm-geometry/live/live.js"></script>
<script src="/rhythm-geometry/live/knobs.js"></script>
<script src="/rhythm-geometry/nav.js" defer></script>
</body>
</html>
