<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100806">
<title>Record remote · Three Cities</title>
<link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abel&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="/design-assets/tokens/tokens.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--color-ground); color: var(--color-ink); font: 15px/1.5 var(--font-mono);
       padding: max(var(--space-l), env(safe-area-inset-top)) var(--space-gutter) max(var(--space-l), env(safe-area-inset-bottom)); }
main { width: min(480px, 100%); margin: 0 auto; display: grid; gap: var(--space-m); }
.kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-ink-dim); display: flex; justify-content: space-between; align-items: center; gap: var(--space-s); }
h1 { margin: 0; font: 400 30px/1.15 var(--font-display); letter-spacing: 0.04em; }
.link { display: flex; align-items: center; gap: var(--space-s); font-size: 12px; color: var(--color-ink-dim); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-ink-faint); flex: none; }
.dot.on { background: var(--color-city-copenhagen); }
.cities { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-s); }
.city { position: relative; min-height: 84px; padding: var(--space-m) var(--space-s); border: 1px solid var(--color-line); border-radius: var(--radius-card); background: var(--color-panel); color: var(--color-ink);
        font: 400 20px/1.1 var(--font-display); letter-spacing: 0.04em; cursor: pointer; display: grid; place-items: center; gap: var(--space-xs); text-align: center; }
.city small { font: 400 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-ink-dim); }
.city[aria-pressed="true"] { border-width: 2px; border-color: var(--c); background: color-mix(in srgb, var(--c) 24%, var(--color-panel)); }
.city.has small::before { content: "\25CF  "; color: var(--c); }
.rec { width: 100%; min-height: 38vh; min-height: 38dvh; border: 0; border-radius: var(--radius-panel); cursor: pointer; background: var(--color-record); color: var(--color-ground);
       font: 400 54px/1 var(--font-display); letter-spacing: 0.06em; display: grid; place-items: center; text-transform: uppercase; }
.rec small { display: block; font: 500 13px var(--font-mono); letter-spacing: 0.08em; margin-top: var(--space-s); text-transform: none; opacity: 0.8; }
.rec.live { background: var(--color-ink); animation: pulse 1.2s ease-in-out infinite; }
.rec[disabled] { opacity: 0.4; }
@keyframes pulse { 50% { opacity: 0.75; } }
@media (prefers-reduced-motion: reduce) { .rec.live { animation: none; } }
.meter { height: 8px; border-radius: var(--radius-lcd); background: var(--color-line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--color-ember); transition: width 120ms linear; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-s); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-ink-dim); }
.chip, .ghost { min-height: 44px; padding: 0 var(--space-m); border-radius: var(--radius-chip); border: 1px solid var(--color-line); background: none; color: var(--color-ink-dim); font: 500 13px var(--font-mono); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--color-ember); color: var(--color-ink); background: color-mix(in srgb, var(--color-ember) 22%, transparent); }
.ghost { color: var(--color-ink); border-color: rgba(243,236,230,0.5); width: 100%; }
.status { min-height: 3em; font-size: 13px; color: var(--color-ink-dim); text-align: center; }
.pair { display: grid; gap: var(--space-m); }
.pair input { min-height: 64px; border-radius: var(--radius-card); border: 1px solid var(--color-line); background: var(--color-panel); color: var(--color-ink); font: 500 32px var(--font-mono); letter-spacing: 0.3em; text-align: center; text-transform: uppercase; }
.pair .go { min-height: 58px; border-radius: 29px; border: 0; background: var(--color-ink); color: var(--color-ground); font: 500 15px var(--font-mono); letter-spacing: 0.05em; cursor: pointer; }
.hint { font-size: 12px; color: var(--color-ink-faint); text-align: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="kicker"><span>Three Cities</span><span class="link"><i class="dot" id="dot"></i><span id="linkTxt">Not paired</span></span></div>
  <h1>Record remote</h1>

  <form class="pair" id="pair">
    <p class="status" style="text-align:left">On the computer, open the Record test page and press Phone remote. Type the six letters it shows.</p>
    <input id="code" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="6" aria-label="Pairing code" placeholder="ABC234">
    <button class="go" type="submit">Pair</button>
    <p class="status" id="pairMsg"></p>
  </form>

  <section id="remote" hidden>
    <div class="cities" id="cities" role="group" aria-label="Choose a city"></div>
    <div style="height:var(--space-m)"></div>
    <button class="rec" id="rec" type="button"><span id="recTxt">Record</span></button>
    <div style="height:var(--space-m)"></div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <p class="status" id="status" aria-live="polite">Pick a city, then Record.</p>
    <div class="chips" role="group" aria-label="Count in"><span>Count in</span>
      <button class="chip" type="button" data-n="0" aria-pressed="false">None</button><button class="chip" type="button" data-n="3" aria-pressed="false">3 s</button><button class="chip" type="button" data-n="5" aria-pressed="true">5 s</button><button class="chip" type="button" data-n="10" aria-pressed="false">10 s</button>
    </div>
    <div style="height:var(--space-m)"></div>
    <button class="ghost" id="next" type="button" hidden>Next city</button>
    <div style="height:var(--space-s)"></div>
    <button class="ghost" id="clear" type="button">Clear this take</button>
    <p class="hint"><a href="#" id="unpair" style="color:inherit">Pair with a different computer</a></p>
  </section>
</main>
<script>
(() => {
  const LIVE = "https://three-cities-quiz.jim-4cc.workers.dev", QS = new URLSearchParams(location.search);
  const API = (() => { const o = QS.get("api"); return o && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(o) ? o : LIVE; })();
  const $ = id => document.getElementById(id);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  const COL = ["--color-city-boston", "--color-city-copenhagen", "--color-city-london"];
  let hold = 0, code = (QS.get("c") || lsGet("tc-remote-code") || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 6), delay = Number(lsGet("tc-remote-delay") || 5), st = null, sel = 0, timer = 0, wake = null;
  const post = (path, body) => fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(r => r.json());
  const cmd = c => post("/remote/cmd", { code, cmd: c }).then(r => { if (!r.ok) throw new Error(r.error || "no"); return r; });
  function build(names) {
    $("cities").innerHTML = names.map((n, i) => `<button class="city" type="button" data-i="${i}" style="--c: var(${COL[i]})" aria-pressed="false">${String(n).replace(/</g, "&lt;")}<small>city ${i + 1}</small></button>`).join("");
    $("cities").querySelectorAll(".city").forEach(b => b.addEventListener("click", () => { sel = Number(b.dataset.i); hold = Date.now() + 3000; paint(); cmd("city:" + sel).catch(() => {}); }));
  }
  function paint() {
    const live = st && (st.rec || st.count > 0);
    $("cities").querySelectorAll(".city").forEach((b, i) => { b.setAttribute("aria-pressed", String(i === sel)); b.classList.toggle("has", !!(st && st.take && st.take[i])); b.disabled = !!live; });
    const rec = $("rec"); rec.classList.toggle("live", !!live);
    $("recTxt").innerHTML = st && st.count > 0 ? `${st.count}<small>Starting. Tap to cancel</small>` : st && st.rec ? `Stop<small>${st.secs || 0} s</small>` : "Record";
    $("meter").style.width = (st && st.lvl ? Math.min(100, st.lvl) : 0) + "%";
    $("next").hidden = !(st && st.take && st.take[sel] && !live && sel < 2);
    $("status").textContent = !st ? "Waiting for the computer." : st.msg || "Pick a city, then Record.";
  }
  async function poll() {
    try {
      const r = await fetch(API + "/remote/status?code=" + code).then(x => x.json());
      if (!r.ok) { $("linkTxt").textContent = "No computer with that code"; $("dot").classList.remove("on"); }
      else {
        const on = r.age < 8000; st = r.status; $("dot").classList.toggle("on", on); $("linkTxt").textContent = on ? "Connected" : "Computer not checking in";
        if (st && st.names && $("cities").children.length !== st.names.length) build(st.names);
        if (st && typeof st.city === "number" && (st.rec || st.count || Date.now() > hold)) sel = st.city;
        paint();
      }
    } catch (e) { $("linkTxt").textContent = "No signal"; $("dot").classList.remove("on"); }
    timer = setTimeout(poll, 700);
  }
  let pending = 0;
  function show() { $("pair").hidden = true; $("remote").hidden = false; build(["Boston", "Copenhagen", "London"]); clearTimeout(timer); poll(); try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (e) {} }
  $("pair").addEventListener("submit", async e => {
    e.preventDefault(); code = $("code").value.toUpperCase().replace(/[^A-Z2-9]/g, "");
    if (code.length !== 6) { $("pairMsg").textContent = "That should be six letters and numbers."; return; }
    try { const r = await fetch(API + "/remote/status?code=" + code).then(x => x.json()); if (!r.ok) { $("pairMsg").textContent = "I can't find a computer with that code. Check it is showing on the Record test page."; return; } lsSet("tc-remote-code", code); show(); }
    catch (err) { $("pairMsg").textContent = "Couldn't reach the server. Check your signal."; }
  });
  $("rec").addEventListener("click", async () => {
    const live = st && (st.rec || st.count > 0); pending = 1;
    try { await cmd(live ? "stop" : "record:" + delay); } catch (e) { $("status").textContent = "That didn't reach the computer. Try again."; }
    setTimeout(() => { pending = 0; }, 1500);
  });
  $("next").addEventListener("click", () => { sel = Math.min(2, sel + 1); hold = Date.now() + 3000; paint(); cmd("city:" + sel).catch(() => {}); });
  $("clear").addEventListener("click", () => cmd("clear").catch(() => {}));
  document.querySelectorAll(".chip").forEach(b => { b.setAttribute("aria-pressed", String(Number(b.dataset.n) === delay)); b.addEventListener("click", () => { delay = Number(b.dataset.n); lsSet("tc-remote-delay", String(delay)); document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }); });
  $("unpair").addEventListener("click", e => { e.preventDefault(); lsSet("tc-remote-code", null); clearTimeout(timer); $("remote").hidden = true; $("pair").hidden = false; $("code").value = ""; $("linkTxt").textContent = "Not paired"; $("dot").classList.remove("on"); });
  if (code.length === 6) { $("code").value = code; show(); }
})();
</script>
</body>
</html>
