<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the sky and sea fill the page, the rings are the hero. Title and view switch top left. In Place view a search and surf check sit down the left, readings down the right, one control bar along the bottom. */
:root {
  --abyss: #03102a;
  --accent: #6aa2ff;
  --foam: #f2f7ff;
  --mist: rgba(226, 236, 255, .88);
  --faint: rgba(206, 222, 255, .68);
  --glass: rgba(3, 14, 38, .84);
  --field: rgba(255, 255, 255, .08);
  --edge: rgba(170, 202, 255, .26);
  --display: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--abyss); color: var(--foam); font-family: var(--display); overflow: hidden; -webkit-font-smoothing: antialiased; }
canvas.fill { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#sea { z-index: 0; }
#rings { z-index: 1; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
canvas.inline { display: block; width: 100%; }

.title {
  position: fixed; z-index: 2; max-width: 46vw;
  top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vw, 36px));
  left: max(16px, calc(env(safe-area-inset-left, 0px) + clamp(16px, 3vw, 40px)));
  text-shadow: 0 1px 14px rgba(3, 14, 38, .45);
}
h1 { margin: 0; font-weight: 200; letter-spacing: -.02em; line-height: .9; font-size: clamp(44px, 7vw, 104px); }
.facts { margin-top: 16px; font-family: var(--mono); font-size: 13px; line-height: 1.75; color: var(--foam); font-variant-numeric: tabular-nums; }
.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 9px; vertical-align: 1px; box-shadow: 0 0 9px var(--accent); }
.live.offline::before { background: var(--faint); box-shadow: none; }
.seg { margin-top: 16px; display: inline-flex; border: 1px solid var(--edge); border-radius: 999px; padding: 3px; background: var(--glass); text-shadow: none; }
.seg button { font: 500 13px var(--mono); letter-spacing: .06em; color: var(--mist); background: transparent; border: 0; border-radius: 999px; padding: 9px 20px; cursor: pointer; min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--foam); color: var(--abyss); }

.card, .panel {
  background: var(--glass); border: 1px solid var(--edge); border-radius: 16px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: 18px 20px; font-family: var(--mono); font-size: 13px; color: var(--mist); font-variant-numeric: tabular-nums;
}
.panel {
  position: fixed; z-index: 3; width: 320px; max-height: calc(100% - 150px); overflow: auto;
  top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vw, 36px));
  right: max(16px, calc(env(safe-area-inset-right, 0px) + clamp(16px, 3vw, 40px)));
}
.left { display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: rgba(170,202,255,.35) transparent; }
.left.float {
  position: fixed; z-index: 3; width: 316px; overflow: auto;
  left: max(16px, calc(env(safe-area-inset-left, 0px) + clamp(16px, 3vw, 40px)));
  top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vw, 36px) + clamp(44px, 7vw, 104px) * .9 + 150px);
  max-height: calc(100% - (env(safe-area-inset-top, 0px) + clamp(16px, 3vw, 36px) + clamp(44px, 7vw, 104px) * .9 + 150px) - 112px);
}
.left:not(.float) .card { background: none; border: 0; border-radius: 0; padding: 0 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--edge); backdrop-filter: none; -webkit-backdrop-filter: none; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.share-btn { display: inline-flex; align-items: center; gap: 7px; flex: none; font: 500 12px var(--mono); letter-spacing: .04em; color: var(--foam); background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 0 13px; min-height: 32px; cursor: pointer; }
.share-btn svg { width: 15px; height: 15px; }
.share-btn:hover, .share-btn:focus-visible { border-color: var(--accent); }
.cap { font-size: 11.5px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
.name { font-family: var(--display); font-weight: 300; font-size: 28px; line-height: 1.1; color: var(--foam); margin: 6px 0 4px; overflow-wrap: anywhere; }
.head { font-family: var(--display); font-weight: 300; font-size: 24px; line-height: 1.15; color: var(--foam); margin: 6px 0 2px; }
.sub { font-size: 12.5px; color: var(--faint); margin-bottom: 10px; overflow-wrap: anywhere; }
dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: baseline; }
dt { color: var(--faint); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
dd { margin: 0; text-align: right; color: var(--foam); font-size: 13px; overflow-wrap: anywhere; }
.note { margin-top: 12px; font-size: 12px; line-height: 1.5; color: var(--mist); }
#s-note { font-size: 11.5px; color: var(--faint); }
.scale-cap { font-size: 13px; color: var(--foam); margin-top: 2px; line-height: 1.4; }
.scale-cap b { font-weight: 500; }
#gauges { height: 78px; margin-top: 4px; }
#scale { height: 168px; margin-top: 4px; }
#tide { height: 124px; margin-top: 8px; }
.key { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; color: var(--faint); }
.key i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

form { margin: 0; }
.row { display: flex; gap: 8px; }
input[type=search] { flex: 1; min-width: 0; font: 400 14px var(--display); color: var(--foam); background: var(--field); border: 1px solid var(--edge); border-radius: 10px; padding: 11px 13px; min-height: 42px; }
input[type=search]::placeholder { color: var(--faint); }
.go, .chip { font: 500 12.5px var(--mono); color: var(--abyss); background: var(--accent); border: 0; border-radius: 10px; padding: 0 16px; cursor: pointer; min-height: 42px; }
.chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { background: transparent; color: var(--foam); border: 1px solid var(--edge); border-radius: 999px; min-height: 32px; padding: 0 12px; font-size: 12px; white-space: nowrap; flex: none; }
.chip:hover, .chip:focus-visible { border-color: var(--accent); }
#results:empty, .msg:empty { display: none; }
#results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
#results button { width: 100%; text-align: left; font: 400 13px var(--display); color: var(--foam); background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; line-height: 1.35; }
#results button:hover, #results button:focus-visible { background: var(--field); }
#results small { display: block; color: var(--faint); font: 400 12px var(--mono); }
.msg { margin-top: 10px; font-size: 12.5px; color: var(--mist); }

.bar { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); display: flex; align-items: center; gap: 26px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 10px 26px 10px 10px; }
.play { font: 500 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--abyss); background: var(--accent); border: 0; border-radius: 999px; padding: 13px 24px; cursor: pointer; min-width: 104px; }
.play[aria-pressed="true"] { background: var(--foam); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--foam); outline-offset: 2px; }
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl label { font: 400 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); display: flex; justify-content: space-between; gap: 12px; }
.ctl output { color: var(--foam); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 120px; height: 22px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--edge); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 3px; background: var(--edge); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-top: -5.5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 0; }
.credit { position: fixed; z-index: 2; left: 16px; right: 16px; text-align: center; font: 400 11px var(--mono); color: var(--foam); opacity: .8; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); text-shadow: 0 1px 8px rgba(3, 14, 38, .6); }
.credit a { color: inherit; }

@media (max-width: 760px) {
  .title { max-width: calc(100% - 32px); }
  h1 { font-size: 38px; }
  .facts { font-size: 12px; margin-top: 8px; line-height: 1.6; }
  .seg { position: fixed; margin: 0; top: calc(env(safe-area-inset-top, 0px) + 18px); right: max(16px, env(safe-area-inset-right, 0px)); }
  .seg button { padding: 7px 14px; min-height: 34px; font-size: 12px; }
  .panel { top: auto; width: auto; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 176px); max-height: 31vh; padding: 12px 14px; }
  .name { font-size: 20px; margin: 4px 0 2px; }
  dl { margin-top: 8px; gap: 6px 14px; }
  #scale { height: 120px; } #gauges { height: 70px; }
  .bar { left: 16px; right: 16px; transform: none; max-width: none; gap: 10px 14px; border-radius: 22px; padding: 10px 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); }
  .play { width: 100%; padding: 11px 0; }
  .ctl { flex: 1; min-width: 0; }
  input[type=range] { width: 100%; }
  .credit { font-size: 10px; }
}
</style>
</head>
<body>
<canvas class="fill" id="sea" aria-hidden="true"></canvas>
<canvas class="fill" id="rings" aria-label="Rings. Hits come from wave height, steps from wave period, pitch from temperature."></canvas>

<div class="title">
  <h1>Blue Wave</h1>
  <div class="facts">
    <div><span class="live offline" id="live">Loading the sea</span></div>
    <div id="means">&nbsp;</div>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="m-world" aria-pressed="true">World</button>
    <button id="m-place" aria-pressed="false">Place</button>
  </div>
</div>

<div class="left" id="left" hidden>
  <form class="card" id="search" role="search">
    <label class="sr" for="q">Search for a beach or place</label>
    <div class="row">
      <input id="q" type="search" placeholder="Search a beach or town" autocomplete="off">
      <button type="submit" class="go">Go</button>
    </div>
    <div class="chips">
      <button type="button" class="chip" id="here">Use my location</button>
      <button type="button" class="chip" data-lat="42.6177" data-lon="-70.5866" data-name="Good Harbor Beach" data-sub="Gloucester, Massachusetts">Good Harbor</button>
      <button type="button" class="chip" data-lat="-33.8915" data-lon="151.2767" data-name="Bondi Beach" data-sub="Sydney, Australia">Bondi</button>
      <button type="button" class="chip" data-lat="39.6050" data-lon="-9.0870" data-name="Praia do Norte" data-sub="Nazaré, Portugal">Nazaré</button>
    </div>
    <ul id="results"></ul>
    <div class="msg" id="msg" role="status"></div>
  </form>
  <section class="card" id="surf" aria-live="polite">
    <div class="cap">Surf check</div>
    <div class="head" id="s-head">Reading the sea</div>
    <canvas class="inline" id="tide" role="img" aria-label="Tide height and wave height for the next day"></canvas>
    <div class="key"><span><i style="background:#6aa2ff"></i>Tide</span><span><i style="background:rgba(242,247,255,.55)"></i>Waves</span><span><i style="background:rgba(0,0,0,.6);border:1px solid rgba(170,202,255,.4)"></i>Night</span></div>
    <dl id="s-dl"></dl>
    <div class="note" id="s-note"></div>
  </section>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <div class="top"><div class="cap" id="r-cap">&nbsp;</div><button class="share-btn" id="share" type="button" title="Share what is loaded, with a link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 11H5.5A1.5 1.5 0 0 0 4 12.5v6A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-6a1.5 1.5 0 0 0-1.5-1.5H17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Share</button></div>
  <div class="name" id="r-name">&nbsp;</div>
  <div class="sub" id="r-sub"></div>
  <canvas class="inline" id="gauges" role="img" aria-label="Quick scan of the conditions"></canvas>
  <canvas class="inline" id="scale" role="img" aria-label="A surfer standing beside a wave drawn at the same scale"></canvas>
  <div class="scale-cap" id="scale-cap"></div>
  <dl id="r-dl"></dl>
  <div class="note" id="r-note"></div>
</aside>

<div class="bar" role="group" aria-label="Controls">
  <button class="play" id="play" aria-pressed="false">Play</button>
  <div class="ctl"><label for="tempo">Tempo <output id="tempo-o">60</output></label><input id="tempo" type="range" min="40" max="100" value="60"></div>
  <div class="ctl"><label for="ocean">Ocean <output id="ocean-o">40</output></label><input id="ocean" type="range" min="0" max="100" value="40"></div>
  <div class="ctl"><label for="vol">Level <output id="vol-o">70</output></label><input id="vol" type="range" min="0" max="100" value="70"></div>
</div>

<div class="credit">Sea and weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (DWD, ECMWF, Météo-France), CC BY 4.0 · Places: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const RAD = Math.PI / 180;
const REFRESH_MS = 10 * 60 * 1000;

// ---------- voices (one per ring) ----------
function make(o) {
  const v = Object.assign({ name: '', lat: 0, lon: 0, kind: 'wave',
    tval: 0, tper: 8, tdir: 0, ttemp: 10, tlv: 0,
    steps: 0, hits: -1, pattern: [], offset: 0, flash: 0, note: 60, pan: 0 }, o);
  v.val = v.tval; v.per = v.tper; v.temp = v.ttemp; v.lv = v.tlv;
  return v;
}
const SEAS = [
  ['Gulf of Maine', 42.5, -69.0, 1.4, 7.5, 210, 12.1], ['North Atlantic', 47.0, -35.0, 3.2, 11.0, 260, 15.8],
  ['North Sea', 56.0, 3.0, 2.1, 7.0, 300, 11.4], ['Mediterranean', 35.0, 18.0, 0.9, 6.0, 320, 21.0],
  ['Gulf of Guinea', 2.0, 3.0, 1.3, 12.0, 200, 28.2], ['Cape of Good Hope', -36.0, 18.0, 3.6, 13.0, 240, 16.5],
  ['Indian Ocean', -20.0, 75.0, 2.8, 12.5, 190, 24.6], ['Bay of Bengal', 15.0, 88.0, 1.2, 8.5, 210, 28.8],
  ['South China Sea', 15.0, 115.0, 1.8, 7.5, 50, 28.4], ['Tasman Sea', -38.0, 160.0, 2.6, 11.5, 225, 16.0],
  ['North Pacific', 35.0, -150.0, 2.2, 10.0, 300, 20.7], ['Drake Passage', -57.0, -63.0, 4.6, 14.0, 260, 4.2],
]; // numbers after the coordinates are sample readings, used until the live sea answers
const WORLD_REF = 6, PLACE_REF = 2.5, WIND_REF = 50;
const world = SEAS.map(([name, lat, lon, h, p, d, t]) =>
  make({ name, lat, lon, tval: h, tper: p, tdir: d, ttemp: t, tlv: h / WORLD_REF, pan: clamp(lon / 180, -1, 1) * .8 }));

const place = {
  name: 'Good Harbor Beach', sub: 'Gloucester, Massachusetts', lat: 42.6177, lon: -70.5866,
  voices: [
    make({ name: 'Waves', tval: .8, tper: 7, tdir: 200, ttemp: 12, tlv: .8 / PLACE_REF, pan: -.6 }),
    make({ name: 'Swell', tval: .6, tper: 9, tdir: 190, ttemp: 12, tlv: .6 / PLACE_REF, pan: -.2 }),
    make({ name: 'Wind sea', tval: .3, tper: 4, tdir: 80, ttemp: 12, tlv: .3 / PLACE_REF, pan: .2 }),
    make({ name: 'Air', kind: 'air', tval: 12, tper: 8, tdir: 270, ttemp: 8, tlv: 12 / WIND_REF, pan: .6 }),
  ],
  loaded: false, live: false, noSea: false, error: false, distKm: 0, updatedAt: null,
  windKmh: 12, gust: null, airTemp: null, seaTemp: null, feels: null, cloud: null, rain: 0,
  off: null, sunrise: null, sunset: null, coast: null, hr: null, tide: null,
};
try {
  const saved = JSON.parse(localStorage.getItem('bluewave.place') || 'null');
  if (saved && isFinite(saved.lat) && isFinite(saved.lon) && saved.name) {
    place.name = String(saved.name); place.sub = String(saved.sub || ''); place.lat = +saved.lat; place.lon = +saved.lon;
  }
} catch (e) { /* storage unavailable, fine */ }

let mode = 'world', voices = world, selected = 1;
let worldLive = false, worldUpdated = null;

// ---------- rhythm ----------
function euclid(k, n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(Math.floor((i + 1) * k / n) - Math.floor(i * k / n) === 1);
  return out;
}
const PENTA = [0, 2, 4, 7, 9];
function noteFor(temp) { const idx = Math.round(clamp((temp + 2) / 32, 0, 1) * 14); return 50 + Math.floor(idx / 5) * 12 + PENTA[idx % 5]; }
function rebuild(s) {
  const steps = Math.round(clamp(s.tper, 5, 16)), maxHits = Math.max(1, Math.floor(steps / 2));
  const hits = s.tlv < .02 ? 0 : clamp(1 + Math.round(clamp(s.tlv, 0, 1) * (maxHits - 1)), 1, maxHits);
  if (steps !== s.steps || hits !== s.hits) { s.steps = steps; s.hits = hits; s.pattern = hits ? euclid(hits, steps) : new Array(steps).fill(false); }
  s.offset = Math.round(((s.tdir % 360) + 360) % 360 / 360 * steps) % steps;
  s.note = noteFor(s.ttemp);
}
world.forEach(rebuild); place.voices.forEach(rebuild);

// ---------- words and units ----------
const fm = (m) => `${m.toFixed(1)} m · ${(m * 3.281).toFixed(1)} ft`;
const fc = (c) => `${c.toFixed(1)} °C · ${Math.round(c * 9 / 5 + 32)} °F`;
const fw = (k) => `${Math.round(k)} km/h · ${Math.round(k * .621)} mph`;
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const dirName = (d) => COMPASS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const pad2 = (n) => String(n).padStart(2, '0');
const hhmmOf = (ms) => { const d = new Date(ms); return pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()); };
const coord = (lat, lon) => `${Math.abs(lat).toFixed(2)}° ${lat >= 0 ? 'N' : 'S'} · ${Math.abs(lon).toFixed(2)}° ${lon >= 0 ? 'E' : 'W'}`;
const angDiff = (a, b) => { const d = Math.abs(((a - b) % 360 + 540) % 360 - 180); return d; };
function km(aLat, aLon, bLat, bLon) {
  const dLat = (bLat - aLat) * RAD, dLon = (bLon - aLon) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * RAD) * Math.cos(bLat * RAD) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
function bearing(aLat, aLon, bLat, bLon) {
  const y = Math.sin((bLon - aLon) * RAD) * Math.cos(bLat * RAD);
  const x = Math.cos(aLat * RAD) * Math.sin(bLat * RAD) - Math.sin(aLat * RAD) * Math.cos(bLat * RAD) * Math.cos((bLon - aLon) * RAD);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}
const localNow = () => Date.now() + (place.off != null ? place.off : Math.round(place.lon / 15) * 3600) * 1000;
const parseLocal = (s) => Date.parse(String(s).length === 16 ? s + ':00Z' : s + 'Z'); // local clock time stored as if it were UTC

function sizeWord(h) { return h < .3 ? 'Flat' : h < .7 ? 'Small' : h < 1.3 ? 'Fun-sized' : h < 2 ? 'Solid' : h < 3.5 ? 'Big' : 'Huge'; }
function compare(h) {
  if (h < .15) return 'barely a ripple'; if (h < .35) return 'around your ankles'; if (h < .7) return 'up to your knees';
  if (h < 1.1) return 'up to your waist'; if (h < 1.5) return 'up to your chest'; if (h < 1.95) return 'over your head';
  return (h >= 4.4 ? 'taller than a double-decker bus, ' : '') + `about ${(h / 1.75).toFixed(1)} people tall`;
}
function wetsuit(t) {
  return t >= 24 ? 'Boardshorts' : t >= 20 ? 'Spring suit' : t >= 17 ? '3/2 wetsuit' : t >= 14 ? '4/3 wetsuit' : t >= 11 ? '5/4 suit and boots'
    : t >= 8 ? '5/4 suit, hood, boots, gloves' : '6/5 suit, hood, boots, gloves';

  const path = (sh) => { c.beginPath(); for (let x = wx0; x <= cw - 6; x += 3) { const y = base - h * k * prof(x, sh); x === wx0 ? c.moveTo(x, y) : c.lineTo(x, y); } };
  path(lam * .33); c.strokeStyle = 'rgba(106,162,255,.35)'; c.lineWidth = 1.2; c.stroke();
  path(0); const grad = c.createLinearGradient(0, base - h * k, 0, base); grad.addColorStop(0, 'rgba(106,162,255,.26)'); grad.addColorStop(1, 'rgba(106,162,255,.04)');
  c.save(); c.lineTo(cw - 6, base); c.lineTo(wx0, base); c.closePath(); c.fillStyle = grad; c.fill(); c.restore();
  path(0); c.strokeStyle = '#6aa2ff'; c.lineWidth = 2; c.stroke();
  const yH = Math.max(10, base - h * k);
  c.setLineDash([3, 4]); c.strokeStyle = 'rgba(242,247,255,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(wx0 - 6, yH); c.lineTo(cw - 6, yH); c.stroke(); c.setLineDash([]);
  c.font = '500 12px "JetBrains Mono", ui-monospace, monospace'; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillStyle = FOAM; c.fillText(`${h.toFixed(1)} m`, cw - 6, yH - 4);
  drawSurfer(c, px, base, k, o);
  c.font = '400 11px "JetBrains Mono", ui-monospace, monospace'; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = 'rgba(206,222,255,.78)';
  c.fillText('you 1.75 m · board 1.9 m', 4, base + 8);
}

// ---------- the tide chart: the next day of tide and waves, with the night shaded ----------
function drawTide(now) {
  const f = fit($('tide')); if (!f) return; const { c, cw, ch } = f, p = place, T = p.tide;
  c.font = '400 11px "JetBrains Mono", ui-monospace, monospace'; c.textBaseline = 'middle';
  if (!p.hr || !T) { c.fillStyle = 'rgba(206,222,255,.7)'; c.textAlign = 'center'; c.fillText(p.loaded && !p.noSea && !p.error ? 'No tide data for this spot' : '', cw / 2, ch / 2); return; }
  const tn = localNow(), t0 = tn - 3 * 3600e3, t1 = tn + 27 * 3600e3, padL = 8, padR = 8, padT = 20, padB = 20;
  const X = (t) => padL + (t - t0) / (t1 - t0) * (cw - padL - padR);
  const wTop = ch - padB - 16, tideTop = padT, tideBot = wTop - 16, offMs = (p.off != null ? p.off : Math.round(p.lon / 15) * 3600) * 1000;
  const Yt = (v) => tideTop + (1 - (v - T.lo) / ((T.hi - T.lo) || 1)) * (tideBot - tideTop);
  let hmax = .4; p.hr.t.forEach((t, i) => { if (t >= t0 && t <= t1 && p.hr.wh[i] != null) hmax = Math.max(hmax, p.hr.wh[i]); });
  // night
  for (let t = Math.floor(t0 / 3600e3) * 3600e3; t < t1; t += 3600e3) {
    if (astro(p.lat, p.lon, t + 1800e3 - offMs).sunAlt < -1) { const a = Math.max(X(t), padL), b = Math.min(X(t + 3600e3), cw - padR); c.fillStyle = 'rgba(0,0,0,.34)'; c.fillRect(a, 6, Math.max(0, b - a), ch - padB - 6); }
  }
  // hour ticks every six hours
  c.fillStyle = 'rgba(206,222,255,.7)'; c.textAlign = 'center';
  for (let t = Math.ceil(t0 / (6 * 3600e3)) * 6 * 3600e3; t <= t1; t += 6 * 3600e3) { const x = X(t); c.fillRect(x, ch - padB + 2, 1, 4); c.fillText(pad2(new Date(t).getUTCHours()), x, ch - 5); }
  // wave bars
  p.hr.t.forEach((t, i) => { if (t < t0 - 1800e3 || t > t1 || p.hr.wh[i] == null) return; const hh = p.hr.wh[i] / hmax * 16, x = X(t) - 3;
    c.fillStyle = 'rgba(242,247,255,.5)'; c.fillRect(x, ch - padB - hh, 6, hh); });
  // tide line
  let first = true;
  c.save(); c.beginPath(); c.rect(padL, 0, cw - padL - padR, ch); c.clip();
  c.beginPath();
  p.hr.t.forEach((t, i) => { if (t < t0 - 3600e3 || t > t1 + 3600e3 || p.hr.sl[i] == null) return; const x = X(t), y = Yt(p.hr.sl[i]); first ? c.moveTo(x, y) : c.lineTo(x, y); first = false; });
  c.strokeStyle = '#6aa2ff'; c.lineWidth = 2.2; c.lineJoin = 'round'; c.stroke(); c.restore();
  // highs and lows
  const mark = (e, up) => { if (!e || e.t > t1) return; const x = X(e.t), y = Yt(e.lv); c.fillStyle = FOAM; c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill();
    c.textAlign = x > cw - 34 ? 'right' : x < 34 ? 'left' : 'center'; c.fillText(hhmmOf(e.t), x, up ? y - 11 : y + 11); };
  mark(T.nextHigh, true); mark(T.nextLow, false);
  // now
  const xn = X(tn); c.setLineDash([3, 3]); c.strokeStyle = 'rgba(242,247,255,.7)'; c.lineWidth = 1; c.beginPath(); c.moveTo(xn, 8); c.lineTo(xn, ch - padB); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#f2f7ff'; c.beginPath(); c.arc(xn, Yt(T.cur), 4, 0, 7); c.fill();
  c.textAlign = 'left'; c.fillStyle = 'rgba(242,247,255,.9)'; c.fillText('now', Math.min(xn + 5, cw - 28), wTop - 3);
}

// ---------- the sky and the sea behind everything ----------
const SKY = { alt: 20, x: .5, malt: -20, mx: .5, cloud: .25, rain: 0, frac: .5, waxing: true, south: false };
const fr = (v) => v - Math.floor(v);
const STARS = Array.from({ length: 80 }, (_, i) => ({ x: fr(Math.sin(i * 91.7) * 437.58), y: fr(Math.sin(i * 47.3) * 239.1) * .5, s: .6 + fr(Math.sin(i * 13.1) * 77.7) * 1.1, p: i * 1.7 }));
const CLOUDS = Array.from({ length: 10 }, (_, i) => ({ x: fr(Math.sin(i * 31.9) * 91.3) * 1.4, y: .08 + fr(Math.sin(i * 17.3) * 53.1) * .34, r: .09 + fr(Math.sin(i * 7.7) * 19.1) * .09, s: .6 + fr(Math.sin(i * 5.1) * 11.1) }));
const DROPS = Array.from({ length: 70 }, (_, i) => ({ x: fr(Math.sin(i * 12.3) * 91.1), y: fr(Math.sin(i * 8.9) * 33.3), v: .5 + fr(Math.sin(i * 3.3) * 9.9) }));
function skyUpdate(dt) {
  const loc = mode === 'place' ? place : world[selected], A = astro(loc.lat, loc.lon, Date.now()), k = 1 - Math.pow(.02, dt);
  SKY.alt = lerp(SKY.alt, A.sunAlt, k); SKY.x = lerp(SKY.x, skyX(A.sunAz, loc.lat), k);
  SKY.malt = lerp(SKY.malt, A.moonAlt, k); SKY.mx = lerp(SKY.mx, skyX(A.moonAz, loc.lat), k);
  SKY.frac = A.frac; SKY.waxing = A.waxing; SKY.south = loc.lat < 0;
  SKY.cloud = lerp(SKY.cloud, mode === 'place' && place.cloud != null ? place.cloud / 100 : .25, k);
  SKY.rain = lerp(SKY.rain, mode === 'place' && place.rain > .1 ? clamp(place.rain / 2, .15, 1) : 0, k);
}
function drawMoon(c, x, y, r, frac, waxing, south, alpha) {
  c.save(); c.translate(x, y); if (waxing === south) c.scale(-1, 1); c.globalAlpha = alpha;
  c.fillStyle = 'rgba(215,225,255,.16)'; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
  const kk = 2 * frac - 1; c.shadowColor = 'rgba(190,205,255,.8)'; c.shadowBlur = 16; c.fillStyle = '#e6ecff'; c.beginPath(); c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
  if (kk >= 0) c.ellipse(0, 0, Math.max(.01, kk * r), r, 0, Math.PI / 2, Math.PI * 1.5, false); else c.ellipse(0, 0, Math.max(.01, -kk * r), r, 0, Math.PI / 2, -Math.PI / 2, true);
  c.closePath(); c.fill(); c.restore();
}
function drawWorld(now, dt) {
  const hy = H * .6, tt = now / 1000 * (reduce ? .2 : 1), st = seaState();
  const day = clamp((SKY.alt + 6) / 24, 0, 1), warm = clamp(1 - Math.abs(SKY.alt - 2) / 9, 0, 1);
  let top = mix([2, 11, 31], [34, 84, 164], day), mid = mix([6, 24, 61], [58, 116, 196], day), bot = mix([13, 46, 110], [116, 168, 224], day);
  bot = mix(bot, [214, 122, 96], warm * .55); mid = mix(mid, [150, 90, 120], warm * .3);
  const g = SKY.cloud * .4 * day; top = mix(top, [96, 108, 128], g); mid = mix(mid, [110, 124, 146], g); bot = mix(bot, [150, 162, 182], g);
  const sky = sx.createLinearGradient(0, 0, 0, hy); sky.addColorStop(0, rgb(top)); sky.addColorStop(.6, rgb(mid)); sky.addColorStop(1, rgb(bot));
  sx.fillStyle = sky; sx.fillRect(0, 0, W, hy + 2);
  // stars
  const sa = (1 - day) * (1 - SKY.cloud * .7);
  if (sa > .02) STARS.forEach(s => { sx.fillStyle = `rgba(235,242,255,${sa * (.3 + .5 * (.5 + .5 * Math.sin(tt * 1.3 + s.p)))})`; sx.fillRect(s.x * W, s.y * hy, s.s, s.s); });
  // sun and moon: where they really are above this place right now
  const bodyY = (alt) => hy - Math.max(Math.sin(alt * RAD), -.2) * (hy - 40);
  const sxp = SKY.x * W, syp = bodyY(SKY.alt), sunA = clamp((SKY.alt + 4) / 5, 0, 1);
  if (sunA > 0) {
    const wm = clamp(1 - SKY.alt / 18, 0, 1), col = mix([255, 226, 160], [255, 140, 84], wm);
    const gl = sx.createRadialGradient(sxp, syp, 0, sxp, syp, 120); gl.addColorStop(0, rgb(col, .5 * sunA)); gl.addColorStop(1, rgb(col, 0));
    sx.fillStyle = gl; sx.fillRect(sxp - 130, syp - 130, 260, 260);
    sx.fillStyle = rgb(col, .95 * sunA); sx.beginPath(); sx.arc(sxp, syp, 15, 0, 7); sx.fill();
  }
  const moonA = clamp((SKY.malt + 3) / 6, 0, 1) * (day > .6 ? .35 : 1);
  if (moonA > 0) drawMoon(sx, SKY.mx * W, bodyY(SKY.malt), 13, SKY.frac, SKY.waxing, SKY.south, moonA);
  // clouds drift at the speed of the wind, and rain falls when it rains
  const wind = mode === 'place' ? place.windKmh : 14, nC = Math.round(SKY.cloud * CLOUDS.length);
  CLOUDS.forEach((cl, i) => { cl.x += dt * (.004 + wind * .0006) * cl.s; if (cl.x > 1.25) cl.x = -.25; if (i >= nC) return;
    const x = cl.x * W, y = cl.y * hy, r = cl.r * Math.max(W, hy) * 1.3, tone = mix([120, 134, 164], [255, 255, 255], day);
    const cg = sx.createRadialGradient(x, y, 0, x, y, r); cg.addColorStop(0, rgb(tone, .34)); cg.addColorStop(1, rgb(tone, 0)); sx.fillStyle = cg; sx.beginPath(); sx.arc(x, y, r, 0, 7); sx.fill(); });
  if (SKY.rain > .05) { sx.strokeStyle = 'rgba(200,220,255,.3)'; sx.lineWidth = 1; sx.beginPath(); const n = Math.round(SKY.rain * DROPS.length);
    for (let i = 0; i < n; i++) { const d = DROPS[i], y = ((d.y + tt * .5 * d.v) % 1) * hy, x = ((d.x - tt * .05 * d.v) % 1 + 1) % 1 * W; sx.moveTo(x, y); sx.lineTo(x - 3, y + 12); } sx.stroke(); }
  // the sea, from a flat distant band to rolling water. Swell and wind chop are drawn separately so a choppy day looks choppy.
  const seaTop = mix(bot, [10, 40, 100], .6), seaBot = mix([13, 46, 110], [30, 82, 160], day);
  const sg = sx.createLinearGradient(0, hy, 0, H); sg.addColorStop(0, rgb(seaTop)); sg.addColorStop(1, rgb(seaBot)); sx.fillStyle = sg; sx.fillRect(0, hy, W, H - hy);
  const glintBody = SKY.alt > 1 ? { x: sxp, a: clamp(SKY.alt / 12, 0, 1) * (1 - SKY.cloud * .6), c: [255, 236, 190] } : SKY.malt > 4 ? { x: SKY.mx * W, a: .45 * (1 - SKY.cloud * .6), c: [215, 228, 255] } : null;
  if (glintBody) for (let i = 0; i < 18; i++) { const u = i / 17, y = hy + 4 + Math.pow(u, 1.6) * (H - hy - 10), w = 8 + u * 70 + Math.sin(tt * 1.7 + i * 2.1) * 8;
    sx.fillStyle = rgb(glintBody.c, glintBody.a * (.5 - u * .3)); sx.fillRect(glintBody.x - w / 2 + Math.sin(tt * .8 + i) * 6, y, w, 1.6); }
  const layers = 7, set = 1 + .2 * Math.sin(tt * .35) + .1 * Math.sin(tt * .83 + 1.3); // waves come in sets
  const foamAmt = st.still ? 0 : clamp((st.h - .5) / 2.5 + (st.wind - 18) / 50, 0, 1);
  for (let L = 0; L < layers; L++) {
    const depth = L / (layers - 1), base = H * (.64 + depth * .3), dsc = .45 + depth * .85;
    const A1 = st.still ? 1.5 : Math.min(95, (st.swell * 20 + 3) * set) * dsc, A2 = st.still ? 0 : Math.min(40, (st.chop * 14 + st.wind * .22) * (1 + .15 * Math.sin(tt * 1.1 + L))) * dsc;
    const wl = W / (1.3 + L * .3), wl2 = wl * .3, spd = 2 * Math.PI / Math.max(4, st.per) * (1 + L * .1);
    sx.beginPath(); let p1 = 0, p2 = 0, ys = [];
    for (let x = 0; x <= W + 8; x += 8) {
      const y = base + Math.sin(x / wl * 2 * Math.PI + tt * spd + L) * A1 + Math.sin(x / wl2 * 2 * Math.PI - tt * spd * 2.4 + L * 2) * A2 * .6 + Math.sin(x / (wl2 * .45) + tt * spd * 3.1 + L) * A2 * .25;
      ys.push(y); x === 0 ? sx.moveTo(x, y) : sx.lineTo(x, y);
    }
    sx.lineTo(W, H); sx.lineTo(0, H); sx.closePath();
    sx.fillStyle = `rgba(${Math.round(20 + depth * 20 + day * 24)},${Math.round(60 + depth * 40 + day * 36)},${Math.round(150 + depth * 70 - day * 10)},${.12 + depth * .07})`; sx.fill();
    sx.strokeStyle = `rgba(210,228,255,${.06 + depth * .08 + day * .05})`; sx.lineWidth = 1; sx.stroke();
    if (foamAmt > .02 && L >= 2) { sx.strokeStyle = `rgba(245,250,255,${foamAmt * (.25 + depth * .35)})`; sx.lineWidth = 1.6; sx.beginPath();
      for (let i = 1; i < ys.length - 1; i++) if (ys[i] < ys[i - 1] && ys[i] < ys[i + 1] && base - ys[i] > A1 * .55) { const x = i * 8; sx.moveTo(x - 5, ys[i] + 1); sx.lineTo(x + 5, ys[i] + 1); } sx.stroke(); }
  }
}

// ---------- the rings ----------
function geom() {
  const small = W < 760, cx = W / 2, cy = small ? H * .34 : H * .47;
  const maxR = Math.min(W * (small ? .42 : .38), H * (small ? .17 : .35));
  return { cx, cy, maxR, minR: maxR * (mode === 'place' ? .36 : .2), small };
}
function order() { const idx = voices.map((s, i) => i); return mode === 'world' ? idx.sort((a, b) => voices[a].temp - voices[b].temp) : idx; }
let ringOrder = order();
function radiusOf(i, g) { const n = voices.length, k = ringOrder.indexOf(i); return n < 2 ? g.maxR : g.maxR - (g.maxR - g.minR) * (k / (n - 1)); }
const ripples = [];
function hitVisual(i, step) {
  const s = voices[i]; if (!s) return; s.flash = 1;
  const g = geom(), r = radiusOf(i, g), a = step / s.steps * Math.PI * 2 - Math.PI / 2;
  ripples.push({ x: g.cx + Math.cos(a) * r, y: g.cy + Math.sin(a) * r, t: 0, c: tempColor(s.temp, 1) }); if (ripples.length > 60) ripples.shift();
}
let manual = 0, lastCycle = 0;
rings.addEventListener('pointerdown', (e) => {
  const g = geom(), d = Math.hypot(e.clientX - g.cx, e.clientY - g.cy); let best = -1, bd = 1e9;
  voices.forEach((s, i) => { const dd = Math.abs(radiusOf(i, g) - d); if (dd < bd) { bd = dd; best = i; } });
  if (best >= 0 && bd < 26) { selected = best; manual = performance.now(); renderPanel(); }
});
function pill(text, x, y, strong, icon) {
  rx.font = '500 13px "JetBrains Mono", ui-monospace, monospace';
  const iw = icon ? 22 : 0, w = rx.measureText(text).width + 18 + iw, h = 26;
  rx.fillStyle = 'rgba(3,14,38,.9)'; rx.beginPath(); if (rx.roundRect) rx.roundRect(x - w / 2, y - h / 2, w, h, 13); else rx.rect(x - w / 2, y - h / 2, w, h); rx.fill();
  rx.strokeStyle = strong ? 'rgba(170,202,255,.6)' : 'rgba(170,202,255,.3)'; rx.lineWidth = 1; rx.stroke();
  if (icon) icon(rx, x - w / 2 + 16, y);
  rx.fillStyle = '#f2f7ff'; rx.textAlign = 'center'; rx.textBaseline = 'middle'; rx.fillText(text, x + iw / 2, y + .5);
}
function labelFor(s) { return mode === 'place' && s.kind === 'air' ? `Air  ${s.temp.toFixed(0)} °C` : `${s.name}  ${s.val.toFixed(1)} m`; }
function iconFor(s, t) {
  if (mode === 'place' && s.kind === 'air') return (c, x, y) => gThermo(c, x, y, 18, clamp((s.temp + 10) / 50, 0, 1), airColor(s.temp));
  return (c, x, y) => gGlass(c, x, y, 11, 16, waveFrac(s.val), t);
}

let t0 = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - t0) / 1000); t0 = now;
  const k = 1 - Math.pow(.2, dt);
  [world, place.voices].forEach(list => list.forEach(s => {
    s.val = lerp(s.val, s.tval, k); s.per = lerp(s.per, s.tper, k); s.temp = lerp(s.temp, s.ttemp, k); s.lv = lerp(s.lv, s.tlv, k); s.flash = Math.max(0, s.flash - dt * 1.6);
  }));
  if (mode === 'world') { ringOrder = order(); if (now - manual > 20000 && now - lastCycle > 7000) { selected = (selected + 1) % world.length; lastCycle = now; renderPanel(); } }
  skyUpdate(dt); drawWorld(now, dt);

  rx.clearRect(0, 0, W, H);
  const g = geom(); let frac = 0, curTick = 0;
  if (playing && ctx) { const sd = stepDur(); frac = clamp((ctx.currentTime - (nextTime - sd)) / sd, 0, 1); curTick = tick - 1; }
  voices.forEach((s, i) => {
    const r = radiusOf(i, g), sel = i === selected;
    rx.beginPath(); rx.arc(g.cx, g.cy, r, 0, Math.PI * 2); rx.strokeStyle = tempColor(s.temp, sel ? .75 : .3 + s.flash * .35); rx.lineWidth = sel ? 1.6 : 1; rx.stroke();
    const steps = s.steps;
    for (let q = 0; q < steps; q++) {
      const ang = q / steps * Math.PI * 2 - Math.PI / 2, x = g.cx + Math.cos(ang) * r, y = g.cy + Math.sin(ang) * r, hit = s.pattern[(q + s.offset) % steps];
      rx.beginPath();
      if (hit) { const lit = playing && ((curTick % steps + steps) % steps) === q ? s.flash : 0; rx.arc(x, y, (g.small ? 2.8 : 4) + lit * 3.5, 0, Math.PI * 2); rx.fillStyle = tempColor(s.temp, .88 + lit * .12); rx.fill(); }
      else { rx.arc(x, y, 1.3, 0, Math.PI * 2); rx.fillStyle = 'rgba(210,226,255,.45)'; rx.fill(); }
    }
    if (playing) { const pos = (((curTick % steps) + steps) % steps + frac) / steps, ang = pos * Math.PI * 2 - Math.PI / 2;
      rx.beginPath(); rx.arc(g.cx + Math.cos(ang) * r, g.cy + Math.sin(ang) * r, 1.8, 0, Math.PI * 2); rx.fillStyle = 'rgba(242,247,255,.95)'; rx.fill(); }
  });
  voices.forEach((s, i) => { if (mode === 'place' || i === selected) pill(labelFor(s), g.cx, g.cy - radiusOf(i, g) - 18, i === selected, iconFor(s, now / 1000)); });
  for (let j = ripples.length - 1; j >= 0; j--) {
    const p = ripples[j]; p.t += dt; if (p.t > 1.8) { ripples.splice(j, 1); continue; }
    const kk = p.t / 1.8; rx.beginPath(); rx.arc(p.x, p.y, 4 + kk * 46, 0, Math.PI * 2); rx.strokeStyle = p.c.replace(/,1\)$/, `,${(1 - kk) * .45})`); rx.lineWidth = 1; rx.stroke();
  }
  rx.beginPath(); rx.arc(g.cx, g.cy, 2.2, 0, Math.PI * 2); rx.fillStyle = 'rgba(106,162,255,.95)'; rx.fill();

  drawGauges(now); drawScale(now); if (mode === 'place') drawTide(now);
  updateOcean();
  requestAnimationFrame(frame);
}

placeLeft();
let arrivedByLink = false;
try {
  const q = new URLSearchParams(location.search), la = parseFloat(q.get('lat')), lo = parseFloat(q.get('lon')), nm = (q.get('name') || '').trim();
  if (isFinite(la) && isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180 && nm) {
    place.lat = la; place.lon = lo; place.name = nm.slice(0, 80); place.sub = (q.get('sub') || '').slice(0, 100); arrivedByLink = true;
  }
} catch (e) { /* no link state, fine */ }
showFacts(); renderPanel();
if (arrivedByLink) setMode('place');
fetchWorld();
setInterval(() => { fetchWorld(); if (place.loaded) fetchPlace(); }, REFRESH_MS);
setInterval(() => { showFacts(); if (mode === 'place' && place.hr) { analyseTide(place); renderSurf(); } }, 60000);
requestAnimationFrame(frame);
})();
