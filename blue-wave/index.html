<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: rings are the hero, centred. Title and mode switch top left, one solid panel top right, one control bar along the bottom. Live sea drawn behind everything. */
:root {
  --abyss: #03102a;
  --deep: #0a2453;
  --accent: #6aa2ff;
  --foam: #f2f7ff;
  --mist: rgba(226, 236, 255, .86);
  --faint: rgba(206, 222, 255, .64);
  --glass: rgba(3, 14, 38, .84);
  --field: rgba(255, 255, 255, .08);
  --edge: rgba(170, 202, 255, .26);
  --display: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--abyss); color: var(--foam); font-family: var(--display); overflow: hidden; -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#sea { z-index: 0; }
#rings { z-index: 1; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.title {
  position: fixed; z-index: 2; max-width: 46vw;
  top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vw, 36px));
  left: max(16px, calc(env(safe-area-inset-left, 0px) + clamp(16px, 3vw, 40px)));
}
h1 { margin: 0; font-weight: 200; letter-spacing: -.02em; line-height: .9; font-size: clamp(44px, 7vw, 104px); }
.facts { margin-top: 16px; font-family: var(--mono); font-size: 13px; line-height: 1.75; color: var(--mist); font-variant-numeric: tabular-nums; }
.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 9px; vertical-align: 1px; box-shadow: 0 0 9px var(--accent); }
.live.offline::before { background: var(--faint); box-shadow: none; }

.seg { margin-top: 16px; display: inline-flex; border: 1px solid var(--edge); border-radius: 999px; padding: 3px; background: var(--glass); }
.seg button {
  font: 500 13px var(--mono); letter-spacing: .06em; color: var(--mist); background: transparent;
  border: 0; border-radius: 999px; padding: 9px 20px; cursor: pointer; min-height: 38px;
}
.seg button[aria-pressed="true"] { background: var(--foam); color: var(--abyss); }

.panel {
  position: fixed; z-index: 3; width: 320px; max-height: calc(100% - 150px); overflow: auto;
  top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vw, 36px));
  right: max(16px, calc(env(safe-area-inset-right, 0px) + clamp(16px, 3vw, 40px)));
  background: var(--glass); border: 1px solid var(--edge); border-radius: 16px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: 18px 20px; font-family: var(--mono); font-size: 13px; color: var(--mist); font-variant-numeric: tabular-nums;
}
.cap { font-size: 11.5px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
.name { font-family: var(--display); font-weight: 300; font-size: 28px; line-height: 1.1; color: var(--foam); margin: 6px 0 4px; overflow-wrap: anywhere; }
.sub { font-size: 12.5px; color: var(--faint); margin-bottom: 12px; overflow-wrap: anywhere; }
#scale { position: static; inset: auto; z-index: auto; width: 100%; height: 138px; display: block; margin: 6px 0 0; }
.scale-cap { font-size: 13px; color: var(--foam); margin-top: 2px; line-height: 1.4; }
.scale-cap b { font-weight: 500; }
dl { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; align-items: baseline; }
dt { color: var(--faint); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
dd { margin: 0; text-align: right; color: var(--foam); font-size: 13.5px; }
.note { margin-top: 14px; font-size: 12.5px; line-height: 1.5; color: var(--mist); }

form { margin: 0 0 16px; }
.row { display: flex; gap: 8px; }
input[type=search] {
  flex: 1; min-width: 0; font: 400 14px var(--display); color: var(--foam); background: var(--field);
  border: 1px solid var(--edge); border-radius: 10px; padding: 11px 13px; min-height: 42px;
}
input[type=search]::placeholder { color: var(--faint); }
.go, .chip { font: 500 12.5px var(--mono); color: var(--abyss); background: var(--accent); border: 0; border-radius: 10px; padding: 0 16px; cursor: pointer; min-height: 42px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { background: transparent; color: var(--foam); border: 1px solid var(--edge); border-radius: 999px; min-height: 34px; padding: 0 13px; font-size: 12px; }
.chip:hover, .chip:focus-visible { border-color: var(--accent); }
#results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
#results button { width: 100%; text-align: left; font: 400 13px var(--display); color: var(--foam); background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; line-height: 1.35; }
#results button:hover, #results button:focus-visible { background: var(--field); }
#results small { display: block; color: var(--faint); font: 400 12px var(--mono); }
.msg { margin-top: 10px; font-size: 12.5px; color: var(--mist); min-height: 1em; }

.bar {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  display: flex; align-items: center; gap: 26px; flex-wrap: wrap; justify-content: center;
  max-width: calc(100% - 32px);
  background: var(--glass); border: 1px solid var(--edge); border-radius: 999px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: 10px 26px 10px 10px;
}
.play { font: 500 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--abyss); background: var(--accent); border: 0; border-radius: 999px; padding: 13px 24px; cursor: pointer; min-width: 104px; }
.play[aria-pressed="true"] { background: var(--foam); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--foam); outline-offset: 2px; }
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl label { font: 400 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); display: flex; justify-content: space-between; gap: 12px; }
.ctl output { color: var(--foam); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 120px; height: 22px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--edge); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 3px; background: var(--edge); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-top: -5.5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 0; }

.credit { position: fixed; z-index: 2; left: 16px; right: 16px; text-align: center; font: 400 11px var(--mono); color: var(--faint); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
.credit a { color: inherit; }

@media (max-width: 760px) {
  .title { max-width: calc(100% - 32px); }
  h1 { font-size: 38px; }
  .facts { font-size: 12px; margin-top: 8px; line-height: 1.6; }
  .seg { position: fixed; margin: 0; top: calc(env(safe-area-inset-top, 0px) + 18px); right: max(16px, env(safe-area-inset-right, 0px)); }
  .seg button { padding: 7px 14px; min-height: 34px; font-size: 12px; }
  .panel { top: auto; width: auto; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 176px); max-height: 25vh; padding: 12px 14px; }
  .name { font-size: 20px; margin: 4px 0 2px; }
  dl { margin-top: 8px; gap: 6px 14px; }
  #scale { height: 100px; }
  .bar { left: 16px; right: 16px; transform: none; max-width: none; gap: 10px 14px; border-radius: 22px; padding: 10px 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); }
  .play { width: 100%; padding: 11px 0; }
  .ctl { flex: 1; min-width: 0; }
  input[type=range] { width: 100%; }
  .credit { font-size: 10px; }
}
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<canvas id="rings" aria-label="Rings. Hits come from wave height, steps from wave period, pitch from temperature."></canvas>

<div class="title">
  <h1>Blue Wave</h1>
  <div class="facts">
    <div><span class="live offline" id="live">Loading the sea</span></div>
    <div id="means">&nbsp;</div>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="m-world" aria-pressed="true">World</button>
    <button id="m-place" aria-pressed="false">Place</button>
  </div>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <form id="search" role="search" hidden>
    <label class="sr" for="q">Search for a beach or place</label>
    <div class="row">
      <input id="q" type="search" placeholder="Search a beach or town" autocomplete="off">
      <button type="submit" class="go">Go</button>
    </div>
    <div class="chips">
      <button type="button" class="chip" id="here">Use my location</button>
      <button type="button" class="chip" data-lat="42.6177" data-lon="-70.5866" data-name="Good Harbor Beach" data-sub="Gloucester, Massachusetts">Good Harbor</button>
      <button type="button" class="chip" data-lat="-33.8915" data-lon="151.2767" data-name="Bondi Beach" data-sub="Sydney, Australia">Bondi</button>
      <button type="button" class="chip" data-lat="39.6050" data-lon="-9.0870" data-name="Praia do Norte" data-sub="Nazaré, Portugal">Nazaré</button>
    </div>
    <ul id="results"></ul>
    <div class="msg" id="msg" role="status"></div>
  </form>
  <div class="cap" id="r-cap">&nbsp;</div>
  <div class="name" id="r-name">&nbsp;</div>
  <div class="sub" id="r-sub"></div>
  <canvas id="scale" role="img" aria-label="A person standing beside a wave drawn at the same scale"></canvas>
  <div class="scale-cap" id="scale-cap"></div>
  <dl id="r-dl"></dl>
  <div class="note" id="r-note"></div>
</aside>

<div class="bar" role="group" aria-label="Controls">
  <button class="play" id="play" aria-pressed="false">Play</button>
  <div class="ctl"><label for="tempo">Tempo <output id="tempo-o">60</output></label><input id="tempo" type="range" min="40" max="100" value="60"></div>
  <div class="ctl"><label for="ocean">Ocean <output id="ocean-o">40</output></label><input id="ocean" type="range" min="0" max="100" value="40"></div>
  <div class="ctl"><label for="vol">Level <output id="vol-o">70</output></label><input id="vol" type="range" min="0" max="100" value="70"></div>
</div>

<div class="credit">Sea and weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (DWD, ECMWF, Météo-France), CC BY 4.0 · Places: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const REFRESH_MS = 10 * 60 * 1000;

// ---------- voices (one per ring) ----------
function make(o) {
  const v = Object.assign({ name: '', lat: 0, lon: 0, kind: 'wave',
    tval: 0, tper: 8, tdir: 0, ttemp: 10, tlv: 0,
    steps: 0, hits: -1, pattern: [], offset: 0, flash: 0, note: 60, pan: 0 }, o);
  v.val = v.tval; v.per = v.tper; v.temp = v.ttemp; v.lv = v.tlv;
  return v;
}

// World: twelve open-water points, spread round the globe.
const SEAS = [
  ['Gulf of Maine', 42.5, -69.0, 1.4, 7.5, 210, 12.1], ['North Atlantic', 47.0, -35.0, 3.2, 11.0, 260, 15.8],
  ['North Sea', 56.0, 3.0, 2.1, 7.0, 300, 11.4], ['Mediterranean', 35.0, 18.0, 0.9, 6.0, 320, 21.0],
  ['Gulf of Guinea', 2.0, 3.0, 1.3, 12.0, 200, 28.2], ['Cape of Good Hope', -36.0, 18.0, 3.6, 13.0, 240, 16.5],
  ['Indian Ocean', -20.0, 75.0, 2.8, 12.5, 190, 24.6], ['Bay of Bengal', 15.0, 88.0, 1.2, 8.5, 210, 28.8],
  ['South China Sea', 15.0, 115.0, 1.8, 7.5, 50, 28.4], ['Tasman Sea', -38.0, 160.0, 2.6, 11.5, 225, 16.0],
  ['North Pacific', 35.0, -150.0, 2.2, 10.0, 300, 20.7], ['Drake Passage', -57.0, -63.0, 4.6, 14.0, 260, 4.2],
]; // the numbers after the coordinates are sample readings, used until the live sea answers
const WORLD_REF = 6;   // metres of wave that fill a ring with hits
const PLACE_REF = 2.5;
const WIND_REF = 50;   // km/h of wind that fills the air ring
const world = SEAS.map(([name, lat, lon, h, p, d, t]) =>
  make({ name, lat, lon, tval: h, tper: p, tdir: d, ttemp: t, tlv: h / WORLD_REF, pan: clamp(lon / 180, -1, 1) * .8 }));

const place = {
  name: 'Good Harbor Beach', sub: 'Gloucester, Massachusetts', lat: 42.6177, lon: -70.5866,
  voices: [
    make({ name: 'Waves', tval: .8, tper: 7, tdir: 200, ttemp: 12, tlv: .8 / PLACE_REF, pan: -.6 }),
    make({ name: 'Swell', tval: .6, tper: 9, tdir: 190, ttemp: 12, tlv: .6 / PLACE_REF, pan: -.2 }),
    make({ name: 'Wind sea', tval: .3, tper: 4, tdir: 80, ttemp: 12, tlv: .3 / PLACE_REF, pan: .2 }),
    make({ name: 'Air', kind: 'air', tval: 12, tper: 8, tdir: 270, ttemp: 8, tlv: 12 / WIND_REF, pan: .6 }),
  ],
  loaded: false, live: false, noSea: false, error: false, distKm: 0, windKmh: 0, seaTemp: null, airTemp: null, updatedAt: null,
};
try {
  const saved = JSON.parse(localStorage.getItem('bluewave.place') || 'null');
  if (saved && isFinite(saved.lat) && isFinite(saved.lon) && saved.name) {
    place.name = String(saved.name); place.sub = String(saved.sub || ''); place.lat = +saved.lat; place.lon = +saved.lon;
  }
} catch (e) { /* storage unavailable, fine */ }

let mode = 'world', voices = world, selected = 1;
let worldLive = false, worldUpdated = null;

// ---------- rhythm ----------
function euclid(k, n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(Math.floor((i + 1) * k / n) - Math.floor(i * k / n) === 1);
  return out;
}
const PENTA = [0, 2, 4, 7, 9];
function noteFor(temp) { // D pentatonic: cold is low, warm is high
  const idx = Math.round(clamp((temp + 2) / 32, 0, 1) * 14);
  return 50 + Math.floor(idx / 5) * 12 + PENTA[idx % 5];
}
function rebuild(s) {
  const steps = Math.round(clamp(s.tper, 5, 16));
  const maxHits = Math.max(1, Math.floor(steps / 2));
  const hits = s.tlv < .02 ? 0 : clamp(1 + Math.round(clamp(s.tlv, 0, 1) * (maxHits - 1)), 1, maxHits);
  if (steps !== s.steps || hits !== s.hits) {
    s.steps = steps; s.hits = hits; s.pattern = hits ? euclid(hits, steps) : new Array(steps).fill(false);
  }
  s.offset = Math.round(((s.tdir % 360) + 360) % 360 / 360 * steps) % steps;
  s.note = noteFor(s.ttemp);
}
world.forEach(rebuild); place.voices.forEach(rebuild);

// ---------- units ----------
const fm = (m) => `${m.toFixed(1)} m · ${(m * 3.281).toFixed(1)} ft`;
const fc = (c) => `${c.toFixed(1)} °C · ${Math.round(c * 9 / 5 + 32)} °F`;
const fw = (k) => `${Math.round(k)} km/h · ${Math.round(k * .621)} mph`;
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const dirName = (d) => COMPASS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const hhmm = (d) => String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
const coord = (lat, lon) => `${Math.abs(lat).toFixed(2)}° ${lat >= 0 ? 'N' : 'S'} · ${Math.abs(lon).toFixed(2)}° ${lon >= 0 ? 'E' : 'W'}`;
function km(aLat, aLon, bLat, bLon) {
  const r = Math.PI / 180, dLat = (bLat - aLat) * r, dLon = (bLon - aLon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

// ---------- data ----------
async function fetchWorld() {
  const url = 'https://marine-api.open-meteo.com/v1/marine'
    + '?latitude=' + world.map(s => s.lat).join(',') + '&longitude=' + world.map(s => s.lon).join(',')
    + '&current=wave_height,wave_period,wave_direction,sea_surface_temperature&timezone=GMT';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    let json = await res.json(); if (!Array.isArray(json)) json = [json];
    let got = 0;
    json.forEach((loc, i) => {
      const c = loc && loc.current, s = world[i]; if (!c || !s) return;
      if (c.wave_height != null) { s.tval = c.wave_height; s.tlv = c.wave_height / WORLD_REF; got++; }
      if (c.wave_period != null) s.tper = c.wave_period;
      if (c.wave_direction != null) s.tdir = c.wave_direction;
      if (c.sea_surface_temperature != null) s.ttemp = c.sea_surface_temperature;
    });
    if (got) { worldLive = true; worldUpdated = new Date(); }
  } catch (e) { console.warn('Blue Wave: world sea unavailable, using sample readings', e); }
  world.forEach(rebuild); showFacts(); renderPanel();
}

async function fetchPlace() {
  const p = place;
  // The marine model only has ocean cells, so look at the spot and at rings of points around it.
  const pts = [[0, 0]];
  [.05, .12].forEach(d => { for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; pts.push([Math.cos(a) * d, Math.sin(a) * d / Math.cos(p.lat * Math.PI / 180)]); } });
  const lats = pts.map(q => (p.lat + q[0]).toFixed(4)), lons = pts.map(q => (p.lon + q[1]).toFixed(4));
  const marine = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + lats.join(',') + '&longitude=' + lons.join(',')
    + '&current=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction,wind_wave_height,wind_wave_period,wind_wave_direction,sea_surface_temperature&timezone=GMT';
  const wx = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lon
    + '&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=GMT';
  const stamp = ++fetchPlace.n;
  let m = null, w = null;
  try {
    const [a, b] = await Promise.all([fetch(marine), fetch(wx)]);
    if (a.ok) m = await a.json();
    if (b.ok) w = await b.json();
  } catch (e) { console.warn('Blue Wave: place data unavailable', e); }
  if (stamp !== fetchPlace.n) return; // a newer search replaced this one
  if (m && m.error) m = null; // the service answered with an error
  if (m && !Array.isArray(m)) m = [m];
  p.error = !m;

  let best = null;
  (m || []).forEach((loc, i) => {
    const c = loc && loc.current;
    if (!c || c.wave_height == null) return;
    const d = km(p.lat, p.lon, loc.latitude != null ? loc.latitude : +lats[i], loc.longitude != null ? loc.longitude : +lons[i]);
    if (!best || d < best.d) best = { c, d };
  });
  const wc = w && w.current;
  p.airTemp = wc && wc.temperature_2m != null ? wc.temperature_2m : null;
  p.windKmh = wc && wc.wind_speed_10m != null ? wc.wind_speed_10m : 0;
  const [waves, swell, wind, air] = p.voices;
  p.noSea = !best && !p.error; p.distKm = best ? best.d : 0;
  if (best) {
    const c = best.c, sst = c.sea_surface_temperature != null ? c.sea_surface_temperature : (p.airTemp != null ? p.airTemp : 10);
    p.seaTemp = c.sea_surface_temperature != null ? c.sea_surface_temperature : null;
    [[waves, 'wave_height', 'wave_period', 'wave_direction'], [swell, 'swell_wave_height', 'swell_wave_period', 'swell_wave_direction'], [wind, 'wind_wave_height', 'wind_wave_period', 'wind_wave_direction']]
      .forEach(([v, h, per, dir]) => {
        v.tval = c[h] != null ? c[h] : 0; v.tlv = v.tval / PLACE_REF;
        v.tper = c[per] != null ? c[per] : v.tper; v.tdir = c[dir] != null ? c[dir] : v.tdir; v.ttemp = sst;
      });
  } else {
    p.seaTemp = null;
    [waves, swell, wind].forEach(v => { v.tval = 0; v.tlv = 0; v.ttemp = p.airTemp != null ? p.airTemp : 10; });
  }
  air.tval = p.windKmh; air.tlv = p.windKmh / WIND_REF; air.tper = 8;
  air.tdir = wc && wc.wind_direction_10m != null ? wc.wind_direction_10m : air.tdir;
  air.ttemp = p.airTemp != null ? p.airTemp : (p.seaTemp != null ? p.seaTemp : 10);
  p.live = !!(best || wc) && !p.error; p.loaded = true; p.updatedAt = new Date();
  p.voices.forEach(rebuild); showFacts(); renderPanel();
}
fetchPlace.n = 0;

// ---------- panel and facts ----------
function showFacts() {
  const el = $('live'), means = $('means');
  if (mode === 'world') {
    el.classList.toggle('offline', !worldLive);

      rx.beginPath(); rx.arc(g.cx + Math.cos(ang) * r, g.cy + Math.sin(ang) * r, 1.8, 0, Math.PI * 2); rx.fillStyle = 'rgba(242,247,255,.95)'; rx.fill();
    }
  });
  // labels sit just above each ring at twelve o'clock, clear of the dots
  voices.forEach((s, i) => { if (mode === 'place' || i === selected) pill(labelFor(s), g.cx, g.cy - radiusOf(i, g) - 17, i === selected); });

  for (let j = ripples.length - 1; j >= 0; j--) {
    const p = ripples[j]; p.t += dt;
    if (p.t > 1.8) { ripples.splice(j, 1); continue; }
    const kk = p.t / 1.8;
    rx.beginPath(); rx.arc(p.x, p.y, 4 + kk * 46, 0, Math.PI * 2);
    rx.strokeStyle = p.c.replace(/,1\)$/, `,${(1 - kk) * .45})`); rx.lineWidth = 1; rx.stroke();
  }
  rx.beginPath(); rx.arc(g.cx, g.cy, 2.2, 0, Math.PI * 2); rx.fillStyle = 'rgba(106,162,255,.95)'; rx.fill();

  drawScale(now);
  updateOcean();
  requestAnimationFrame(frame);
}

showFacts(); renderPanel();
fetchWorld();
setInterval(() => { fetchWorld(); if (place.loaded) fetchPlace(); }, REFRESH_MS);
requestAnimationFrame(frame);
})();
</script>
