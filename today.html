<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100806">
<title>Today's reel · Three Cities</title>
<link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abel&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
:root { --ground: #100806; --ink: #f3ece6; --ink-dim: rgba(243,236,230,0.65); --ink-faint: rgba(243,236,230,0.38); --line: rgba(243,236,230,0.16); --ember: #e07a4f; --display: "Abel", "Arial Narrow", sans-serif; --mono: "Source Code Pro", ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 10%, rgba(208,138,106,0.28), transparent 50%), radial-gradient(circle at 85% 30%, rgba(111,163,140,0.22), transparent 45%), radial-gradient(circle at 50% 100%, rgba(169,139,196,0.28), transparent 55%), var(--ground);
       color: var(--ink); font: 15px/1.5 var(--mono); padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
main { width: min(460px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; }
header svg { width: 40px; height: 27px; fill: var(--ink); flex: none; }
.kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); }
h1 { margin: 0; font: 400 30px/1.15 var(--display); letter-spacing: 0.04em; }
.cities { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.stage { position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 62vh; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #0a0605; box-shadow: 0 14px 40px rgba(0,0,0,0.5); }
.stage video, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.stage { width: auto; height: min(62vh, calc((100vw - 32px) * 16 / 9)); }
.btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 58px; border-radius: 29px; border: 0; cursor: pointer;
       background: var(--ink); color: var(--ground); font: 500 15px var(--mono); letter-spacing: 0.05em; text-decoration: none; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid rgba(243,236,230,0.5); min-height: 50px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.status { min-height: 1.4em; font-size: 12px; color: var(--ink-dim); text-align: center; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); min-height: 32px; }
.caption { white-space: pre-wrap; font-size: 13px; color: var(--ink); margin: 8px 0 0; }
.note { font-size: 12px; color: var(--ink-faint); text-align: center; margin: 4px 0 0; }
.stale { color: #ffd98a; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 35.4 24" aria-hidden="true"><path d="M0.5 24v-6.6h11V24zM1.6 17.4v-1.6h8.8v1.6zM3 15.8v-2.4h6v2.4zM2.9 13.4a3.1 3.1 0 0 1 6.2 0zM5.4 10.4V8.2h1.2v2.2zM5.2 8.2L6 6.6l.8 1.6z"/><path fill-rule="evenodd" d="M13.4 24V13h12.6v11h-3.6v-5.2a2.7 2.7 0 0 0-5.4 0V24zM13 13v-1.4h13.4V13zM15.8 11.6a3.9 3.9 0 0 1 7.8 0zM19.3 7.7V5.6h.8v2.1zM19.1 5.6l.6-1.8.6 1.8zM13.6 11.6v-1.8h.9v1.8zM24.9 11.6v-1.8h.9v1.8zM13.4 9.8l.65-1.4.65 1.4zM24.7 9.8l.65-1.4.65 1.4z"/><path fill-rule="evenodd" d="M27.9 24v-3.5h.6V9h-.4V7.6h1V5.4h.8L31.4 0l1.5 5.4h.8v2.2h1V9h-.4v11.5h.6V24zM31.4 10a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4z"/></svg>
    <div><div class="kicker" id="when">Today's reel</div><h1 id="title">Getting today's reel…</h1></div>
  </header>
  <div class="cities" id="cities"></div>
  <div class="stage" id="stage"><img id="poster" alt="" hidden><video id="video" playsinline controls preload="none" hidden></video></div>
  <button class="btn" id="post" type="button" disabled>Post to Instagram</button>
  <div class="row"><button class="btn ghost" id="copy" type="button" disabled>Copy caption</button><a class="btn ghost" id="save" download="three-cities-reel.mp4" href="#" aria-disabled="true">Save video</a></div>
  <div class="status" id="status" aria-live="polite"></div>
  <details><summary>Caption</summary><p class="caption" id="caption"></p></details>
  <p class="note">Made at 8am London time from the live weather. Tap Post to Instagram, choose Instagram, then Reel. Paste the caption.</p>
</main>
<script>
const BASE = "https://raw.githubusercontent.com/forrestjames/three-cities/daily/";
const $ = id => document.getElementById(id), bust = "?t=" + Date.now();
let file = null, caption = "";
(async () => {
  try {
    const meta = await fetch(BASE + "meta.json" + bust).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    caption = await fetch(BASE + "caption.txt" + bust).then(r => r.text());
    const today = new Date().toLocaleDateString("en-CA", { timeZone: "Europe/London" });
    const d = new Date(meta.date + "T12:00:00");
    $("when").textContent = (meta.date === today ? "Today · " : "") + d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) + (meta.episode ? ` · No. ${String(meta.episode).padStart(3, "0")}` : "");
    if (meta.date !== today) { $("when").classList.add("stale"); $("status").textContent = "Today's reel isn't ready yet, so this is the latest one."; }
    $("title").textContent = meta.title || "Three Cities";
    $("cities").textContent = (meta.cities || []).join(" · ");
    $("caption").textContent = caption; $("copy").disabled = false;
    $("poster").src = BASE + "poster.jpg" + bust; $("poster").hidden = false;
    // fetch the video once, so the share sheet can open the moment you tap
    $("status").textContent ||= "Loading the video…";
    const blob = await fetch(BASE + "reel.mp4" + bust).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); });
    const v = new Blob([blob], { type: "video/mp4" }), url = URL.createObjectURL(v);
    file = new File([v], `Three Cities ${meta.date}.mp4`, { type: "video/mp4" });
    $("video").src = url; $("video").poster = $("poster").src; $("video").hidden = false; $("poster").hidden = true;
    $("save").href = url; $("save").download = file.name; $("save").removeAttribute("aria-disabled");
    const canShare = navigator.canShare && navigator.canShare({ files: [file] });
    $("post").disabled = !canShare;
    if (!canShare) $("post").textContent = "Open this page on your phone to post";
    if ($("status").textContent === "Loading the video…") $("status").textContent = `Ready · ${(v.size / 1e6).toFixed(1)} MB`;
  } catch (e) {
    $("title").textContent = "No reel yet";
    $("status").textContent = "The morning reel hasn't been made yet. It arrives just after 8am London time.";
  }
})();
$("post").addEventListener("click", async () => {
  if (!file) return;
  const copied = navigator.clipboard ? navigator.clipboard.writeText(caption).catch(() => {}) : null;   // the caption is ready to paste once Instagram opens
  try { await navigator.share({ files: [file] }); await copied; $("status").textContent = "Caption copied. Paste it in Instagram."; }
  catch (e) { if (e.name !== "AbortError") $("status").textContent = "Couldn't open the share sheet. Use Save video instead."; }
});
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(caption); $("copy").textContent = "Copied"; setTimeout(() => { $("copy").textContent = "Copy caption"; }, 2000); }
  catch (e) { const s = getSelection(), r = document.createRange(); r.selectNodeContents($("caption")); s.removeAllRanges(); s.addRange(r); $("caption").parentNode.open = true; }
});
</script>
</body>
</html>
