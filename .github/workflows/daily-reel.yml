name: Daily reel

# Every morning at 8:00 London time: make today's reel with the live site and publish it for /today.
# GitHub's schedule runs in UTC and often starts hours late, so it tries several times (07:00 to 11:00 UTC).
# A run carries on when it's 8am in London or later AND today's reel hasn't been made yet, so a late start still makes the reel.
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    paths: ["daily-reel/run-now"]   # touch this file to make one straight away

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Is it time, and not made yet?
        id: when
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=Europe/London date +%-H); today=$(TZ=Europe/London date +%F)
          made=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/daily/meta.json" 2>/dev/null | grep -o '"date": *"[0-9-]*"' | grep -o '[0-9]\{4\}-[0-9-]*' || true)
          if [ "$hour" -ge 8 ] && [ "$made" != "$today" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "Skipping: London hour $hour, last reel made for '$made'."; fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'yes'

      - uses: actions/setup-node@v4
        if: steps.when.outputs.go == 'yes'
        with:
          node-version: 20

      - name: Install the browser
        if: steps.when.outputs.go == 'yes'
        working-directory: daily-reel
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Make the reel
        if: steps.when.outputs.go == 'yes'
        working-directory: daily-reel
        env:
          OUT: ${{ github.workspace }}/out
        run: node make-reel.mjs

      - name: Convert to the MP4 Instagram wants, with a poster frame
        if: steps.when.outputs.go == 'yes'
        working-directory: out
        run: |
          ffmpeg -y -loglevel error -i raw.* -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -r 30 -vf "scale=1080:1920" -c:a aac -b:a 192k -ar 48000 -movflags +faststart reel.mp4
          ffmpeg -y -loglevel error -ss 12 -i reel.mp4 -frames:v 1 -q:v 3 -vf "scale=540:960" poster.jpg
          rm -f raw.*
          ls -la

      - name: Publish to the daily branch (only today's reel is kept)
        if: steps.when.outputs.go == 'yes'
        working-directory: out
        run: |
          git init -q -b daily
          git config user.name "Three Cities daily reel"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Reel for $(TZ=Europe/London date +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" daily
